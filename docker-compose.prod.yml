# Production stack for a single server (for example one EC2 instance):
#   caddy -> web (ASP.NET) -> db (PostgreSQL)
# Only ports 80 and 443 are exposed to the internet; the database is reachable only from the web container.
#
# Start / update:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates
      - caddy_config:/config
    depends_on:
      - web

  web:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"   # trust Caddy's X-Forwarded-* headers (so the app knows it is served over HTTPS)
      DataSource: Database
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      DataProtection__KeysPath: /keys                # keeps people logged in across redeploys
      # Discord (all optional; leave empty to keep the integration off)
      Discord__Enabled: ${DISCORD_ENABLED:-false}
      Discord__ApplicationId: ${DISCORD_APPLICATION_ID:-}
      Discord__PublicKey: ${DISCORD_PUBLIC_KEY:-}
      Discord__BotToken: ${DISCORD_BOT_TOKEN:-}
      Discord__GuildId: ${DISCORD_GUILD_ID:-}
      Discord__AllowedChannelId: ${DISCORD_ALLOWED_CHANNEL_ID:-}
      Discord__WebBaseUrl: https://${DOMAIN}
      Discord__RegisterCommandsOnStartup: ${DISCORD_REGISTER_COMMANDS:-false}
    volumes:
      - dpkeys:/keys
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  dpkeys:
  caddy_data:
  caddy_config:
